<div class="pagination">

  <button
    type="button"
    (click)="previousPage()"
    [disabled]="currentPage === 1">
    Previous
  </button>

  <span>
    Page {{ currentPage }} of {{ totalPages }}
  </span>

  <button
    type="button"
    (click)="nextPage()"
    [disabled]="currentPage === totalPages">
    Next
  </button>

</div>
